# 本番公開（nginx-proxy + 外部ネットワーク shared）向けオーバーライド。
# 使い方:
#   docker compose -f docker-compose.yml -f docker-compose.campus.yml up -d --build
#
# 前提: 稼働中の nginx-proxy がネットワーク shared に接続済みであること。
# このファイルは shared 側の設定を変更しない。
# VIRTUAL_HOST は g10db2。現行 PHP の g10db.prc.tsukuba.ac.jp とは別ホスト。
# ホストの 8080 は現行 PHP が使用中なので、ここでは公開しない。
# api と web はプロジェクト内部ネットワークだけに置き、shared からは nginx だけが見える。
# NETWORK_ACCESS=internal は付けない。学外を 403 にすると Basic 認証で通れない。

services:
  nginx:
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST:-g10db2.prc.tsukuba.ac.jp}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-g10db2.prc.tsukuba.ac.jp}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-washo@prc.tsukuba.ac.jp}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-g10db}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    expose:
      - "80"
    ports: !reset []
    networks:
      - default
      - shared

networks:
  default:
  shared:
    external: true
    name: shared
