# g10db-web の入口リバースプロキシ。
# /api は FastAPI へ、それ以外は SPA。
#
# 認証（旧 PHP の .htaccess と同じ条件）:
#   130.158.92.0/24 はパスワード不要。それ以外は Basic 認証。
#   satisfy any は「許可 IP」または「正しいユーザ」のどちらかで通す。
#
# クライアント IP は $remote_addr。X-Forwarded-For は、TCP の接続元が
# 下記のプロキシ網（Docker 上の nginx-proxy など）のときだけ real_ip が採用する。
# 学内クライアント自身はプロキシではないので set_real_ip_from に入れない。
# shared ネットワーク（172.20.0.0/16）は 172.16.0.0/12 に含まれる。
#
# 検索回避:
#   全応答に X-Robots-Tag を付ける（401 を含む）。
#   /robots.txt だけは認証の外に出し、Disallow: / を返す。

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    # 接続元がリバースプロキシのときだけ X-Forwarded-For をクライアント IP にする。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 学内サブネットは認証不要。それ以外は htpasswd（起動時に環境変数から生成）。
    satisfy any;
    allow 130.158.92.0/24;
    deny all;
    auth_basic "G10DB";
    auth_basic_user_file /etc/nginx/htpasswd;

    # 401 でも検索対象にしない。location 側で add_header を書くと継承されない。
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # クローラが Disallow を読めるよう、この path だけ認証しない。
    location = /robots.txt {
        satisfy any;
        allow all;
        auth_basic off;
        default_type text/plain;
        charset utf-8;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
