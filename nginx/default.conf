# g10db-web フロント入口（学内 LAN 向け）。
# Basic 認証はまだ有効にしない。
# /api は FastAPI へ、それ以外は SPA。
#
# クライアント IP は $remote_addr。X-Forwarded-For は、TCP の接続元が
# 下記のプロキシ網（Docker 上の nginx-proxy など）のときだけ real_ip が採用する。
# 学内クライアント自身はプロキシではないので set_real_ip_from に入れない。

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    # 接続元がリバースプロキシのときだけ X-Forwarded-For をクライアント IP にする。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 認証は未導入。有効にするときは auth_basic と htpasswd を戻す。
    auth_basic off;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
