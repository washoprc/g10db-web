# g10db-web フロント入口。
# - 学内 130.158.92.0/24 は Basic 認証なし
# - それ以外は Basic 認証
# - /api は FastAPI へ、それ以外は SPA
# Real IP は nginx-proxy の X-Forwarded-For を信頼する

map $http_x_forwarded_for $client_ip {
    default $remote_addr;
    ~^(?P<first>[0-9.]+) $first;
}

geo $client_ip $is_campus {
    default         0;
    127.0.0.0/8     1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
    130.158.92.0/24 1;
}

# 学内は認証スキップ、学外は Basic 認証
map $is_campus $auth_basic_realm {
    0    "g10db-web";
    1    "off";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    # Real IP（nginx-proxy 配下）
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    auth_basic           $auth_basic_realm;
    auth_basic_user_file /etc/nginx/htpasswd;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
