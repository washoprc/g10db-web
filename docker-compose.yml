# デフォルト: localhost 検証用（外部ネットワーク shared / VIRTUAL_HOST 不要）
# 起動: docker compose up -d --build
# 学内 nginx-proxy 連携は docker-compose.campus.yml を追加する。
# シークレットは .env のみ（コミットしない）。

services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-130.158.92.41}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-gamma10_exp}
      DB_USER: ${DB_USER:-prc}
      DB_PASSWORD: ${DB_PASSWORD:-}
      USE_DEMO: ${USE_DEMO:-1}
      DATA_ROOT: /data
      CONFIG_ROOT: /app/config
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-*}
      MAX_SHOT_LIMIT: "30"
      FTP_HOST: ${FTP_HOST:-}
      FTP_PORT: ${FTP_PORT:-21}
      FTP_USER: ${FTP_USER:-}
      FTP_PASSWORD: ${FTP_PASSWORD:-}
      FTP_BASE_PATH: ${FTP_BASE_PATH:-/usr2/shot}
      FTP_TIMEOUT_SEC: ${FTP_TIMEOUT_SEC:-30}
    volumes:
      - ./config:/app/config:ro
      - ${DATA_ROOT:-./data}:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      # localhost 確認時は空でよい（nginx-proxy は使わない）
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-g10db}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      # ローカルでは認証を実質オフにしたい場合は entrypoint がランダム生成するだけで、
      # 127.0.0.0/8 は default.conf で認証スキップ済み
    ports:
      - "${HOST_HTTP_PORT:-8080}:80"
