# 学内 Docker（nginx-proxy + shared ネットワーク）向け。
# VIRTUAL_HOST は nginx-proxy が自動検出する。
# シークレットは .env のみ（コミットしない）。

services:
  api:
    build: ./backend
    restart: always
    environment:
      DB_HOST: ${DB_HOST:-130.158.92.41}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-gamma10_exp}
      DB_USER: ${DB_USER:-prc}
      DB_PASSWORD: ${DB_PASSWORD:-}
      USE_DEMO: ${USE_DEMO:-0}
      DATA_ROOT: /data
      CONFIG_ROOT: /app/config
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-*}
      MAX_SHOT_LIMIT: "30"
      FTP_HOST: ${FTP_HOST:-}
      FTP_PORT: ${FTP_PORT:-21}
      FTP_USER: ${FTP_USER:-}
      FTP_PASSWORD: ${FTP_PASSWORD:-}
      FTP_BASE_PATH: ${FTP_BASE_PATH:-/G10DATA}
      FTP_TIMEOUT_SEC: ${FTP_TIMEOUT_SEC:-30}
    volumes:
      - ./config:/app/config:ro
      - ${DATA_ROOT:-./data}:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shared

  web:
    build: ./frontend
    restart: always
    expose:
      - "80"
    networks:
      - shared

  nginx:
    build: ./nginx
    restart: always
    depends_on:
      - api
      - web
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST:-g10db.prc.tsukuba.ac.jp}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-g10db.prc.tsukuba.ac.jp}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-g10db}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    ports:
      - "${HOST_HTTP_PORT:-8080}:80"
    networks:
      - shared

networks:
  shared:
    external: true
    name: shared
