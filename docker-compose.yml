# デフォルト: 学内 LAN（130.158.92.0/24）向け公開
# 起動: docker compose up -d --build
# ブラウザ: http://<このホストの LAN IP>:8080  （例: http://130.158.92.11:8080）
# USE_DEMO / FTP_* を .env で変えたあとは api を強制再作成:
#   docker compose up -d --build --force-recreate api
# 学内 nginx-proxy 連携は docker-compose.campus.yml を追加する。
# シークレットは .env のみ（コミットしない）。

services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-130.158.92.41}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-gamma10_exp}
      DB_USER: ${DB_USER:-prc}
      DB_PASSWORD: ${DB_PASSWORD:-}
      USE_DEMO: ${USE_DEMO:-0}
      DATA_ROOT: /data
      CONFIG_ROOT: /app/config
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-*}
      MAX_SHOT_LIMIT: "30"
      FTP_HOST: ${FTP_HOST:-130.158.92.4}
      FTP_PORT: ${FTP_PORT:-21}
      FTP_USER: ${FTP_USER:-}
      FTP_PASSWORD: ${FTP_PASSWORD:-}
      FTP_BASE_PATH: ${FTP_BASE_PATH:-/usr2/shot}
      FTP_TIMEOUT_SEC: ${FTP_TIMEOUT_SEC:-30}
    volumes:
      - ./config:/app/config:ro
      - ${DATA_ROOT:-./data}:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-g10db}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    ports:
      # 学内 LAN から到達できるよう全インタフェースに bind（0.0.0.0）
      # 特定 NIC のみにする場合: HOST_BIND_IP=130.158.92.11
      - "${HOST_BIND_IP:-0.0.0.0}:${HOST_HTTP_PORT:-8080}:80"
